<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e1138" />
      <stop offset="50%" stop-color="#0e0a1a" />
      <stop offset="100%" stop-color="#06040c" />
    </radialGradient>
    <radialGradient id="cyanOrb" cx="20%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pinkOrb" cx="85%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="amberOrb" cx="50%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.07" />
      <circle cx="40" cy="40" r="1" fill="#a855f7" fill-opacity="0.18" />
    </pattern>

    <!-- Filter Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 900; letter-spacing: -1.5px; }
    .subtitle { font-weight: 500; letter-spacing: 0.5px; }
    .tag { font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; font-size: 11px; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGlow)" />
  <rect width="1200" height="420" rx="20" fill="url(#cyberGrid)" />
  
  <!-- Glowing Atmospheric Orbs -->
  <circle cx="240" cy="100" r="260" fill="url(#cyanOrb)" />
  <circle cx="1020" cy="140" r="280" fill="url(#pinkOrb)" />
  <circle cx="600" cy="360" r="220" fill="url(#amberOrb)" />

  <!-- Outer Border Frame -->
  <rect x="1.5" y="1.5" width="1197" height="417" rx="19.5" fill="none" stroke="url(#neonBorder)" stroke-width="1.8" stroke-opacity="0.7" />

  <!-- Corner Tech Accents -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#38bdf8" stroke-width="2" />
  <path d="M 1170 50 L 1170 30 L 1150 30" fill="none" stroke="#f43f5e" stroke-width="2" />
  <path d="M 30 370 L 30 390 L 50 390" fill="none" stroke="#38bdf8" stroke-width="2" />
  <path d="M 1170 370 L 1170 390 L 1150 390" fill="none" stroke="#fbbf24" stroke-width="2" />

  <!-- Top Pill / Badge -->
  <g transform="translate(60, 42)">
    <rect width="320" height="28" rx="14" fill="#1e1b4b" fill-opacity="0.7" stroke="#6366f1" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="16" cy="14" r="4" fill="#38bdf8" filter="url(#glow)" />
    <text x="30" y="18" fill="#c7d2fe" class="font-mono tag">TAURI 2.0 • REACT 19 • SQLITE • TAILWIND</text>
  </g>

  <!-- Version Pill -->
  <g transform="translate(1030, 42)">
    <rect width="110" height="28" rx="14" fill="#064e3b" fill-opacity="0.5" stroke="#10b981" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="16" cy="14" r="3.5" fill="#10b981" />
    <text x="28" y="18" fill="#6ee7b7" class="font-mono tag">v0.1.0 STABLE</text>
  </g>

  <!-- Main Hero Icon (Interactive Budget / HUD Ring) -->
  <g transform="translate(100, 160)">
    <!-- Outer Glow Ring -->
    <circle cx="50" cy="50" r="58" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="6 6" />
    <circle cx="50" cy="50" r="48" fill="#120c24" stroke="url(#neonBorder)" stroke-width="3.5" filter="url(#glow)" />
    <!-- Dynamic Progress Arc -->
    <path d="M 50 10 A 40 40 0 1 1 20 78" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    <!-- Center Icon: Lightning Flame -->
    <path d="M 50 28 L 38 52 L 48 52 L 44 72 L 62 46 L 52 46 Z" fill="#fbbf24" filter="url(#glow)" />
  </g>

  <!-- Main Typography -->
  <g transform="translate(240, 150)">
    <text x="0" y="42" fill="url(#textGrad)" class="font-sans title" font-size="52">LIVING TRACKER</text>
    <text x="450" y="42" fill="#94a3b8" class="font-sans" font-size="28" font-weight="300">| Живой трекер</text>
    
    <text x="0" y="80" fill="#cbd5e1" class="font-sans subtitle" font-size="19">
      Геймифицированная Cyberpunk Life OS с плавающим HUD-виджетом для рабочего стола
    </text>
    
    <text x="0" y="110" fill="#94a3b8" class="font-mono" font-size="13">
      Local SQLite • Eisenhower Matrix • 84d Heatmaps • Multi-Tone Humor • Web Audio FX
    </text>
  </g>

  <!-- Bottom Feature Cards Grid -->
  <!-- Card 1: Floating HUD -->
  <g transform="translate(60, 290)">
    <rect width="250" height="90" rx="14" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <rect x="0" y="0" width="250" height="90" rx="14" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
    <text x="18" y="32" fill="#38bdf8" font-size="20">⚡</text>
    <text x="46" y="30" fill="#f8fafc" class="font-sans" font-size="14" font-weight="700">Плавающий HUD</text>
    <text x="18" y="54" fill="#94a3b8" class="font-sans" font-size="11.5">Мини-виджет поверх всех окон</text>
    <rect x="18" y="62" width="105" height="18" rx="5" fill="#1e293b" />
    <text x="24" y="75" fill="#38bdf8" class="font-mono" font-size="10" font-weight="700">Hotkey: Ctrl+Space</text>
  </g>

  <!-- Card 2: Multi-Tone Gamification -->
  <g transform="translate(330, 290)">
    <rect width="250" height="90" rx="14" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <rect x="0" y="0" width="250" height="90" rx="14" fill="none" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3" />
    <text x="18" y="32" fill="#c084fc" font-size="20">🏆</text>
    <text x="46" y="30" fill="#f8fafc" class="font-sans" font-size="14" font-weight="700">3 Тона Юмора</text>
    <text x="18" y="54" fill="#94a3b8" class="font-sans" font-size="11.5">Сдержанный • Ироничный • Дерзкий</text>
    <rect x="18" y="62" width="125" height="18" rx="5" fill="#1e293b" />
    <text x="24" y="75" fill="#c084fc" class="font-mono" font-size="10" font-weight="700">Ачивки + Confetti FX</text>
  </g>

  <!-- Card 3: 84d Habits Heatmap -->
  <g transform="translate(600, 290)">
    <rect width="250" height="90" rx="14" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <rect x="0" y="0" width="250" height="90" rx="14" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
    <text x="18" y="32" fill="#34d399" font-size="20">🔥</text>
    <text x="46" y="30" fill="#f8fafc" class="font-sans" font-size="14" font-weight="700">Привычки &amp; Heatmap</text>
    <text x="18" y="54" fill="#94a3b8" class="font-sans" font-size="11.5">84 дня стриков &amp; Заморозки</text>
    <rect x="18" y="62" width="130" height="18" rx="5" fill="#1e293b" />
    <text x="24" y="75" fill="#34d399" class="font-mono" font-size="10" font-weight="700">Streak Shields + Сохранение</text>
  </g>

  <!-- Card 4: 10 Themes & Web Audio FX -->
  <g transform="translate(870, 290)">
    <rect width="270" height="90" rx="14" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
    <rect x="0" y="0" width="270" height="90" rx="14" fill="none" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.3" />
    <text x="18" y="32" fill="#fb7185" font-size="20">🎨</text>
    <text x="46" y="30" fill="#f8fafc" class="font-sans" font-size="14" font-weight="700">10 Тем &amp; 8-bit Audio</text>
    <text x="18" y="54" fill="#94a3b8" class="font-sans" font-size="11.5">Cyberpunk, Dracula, Nord, Matrix</text>
    <rect x="18" y="62" width="140" height="18" rx="5" fill="#1e293b" />
    <text x="24" y="75" fill="#fb7185" class="font-mono" font-size="10" font-weight="700">Web Audio FX Soundboard</text>
  </g>
</svg>