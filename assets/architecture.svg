<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1838" />
      <stop offset="100%" stop-color="#0e0c1f" />
    </linearGradient>
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="reactGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <pattern id="diagGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#6366f1" fill-opacity="0.2" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect width="1000" height="440" rx="16" fill="#090a14" stroke="#1e2238" stroke-width="1.5" />
  <rect width="1000" height="440" rx="16" fill="url(#diagGrid)" />

  <!-- Header Title -->
  <text x="40" y="44" fill="#f8fafc" class="sans" font-size="20" font-weight="700">System Architecture Overview</text>
  <text x="350" y="44" fill="#64748b" class="mono" font-size="13">// Tauri 2.0 (Rust) + React 19 Frontend + SQLite Engine</text>

  <!-- Left: Desktop Host Layer (Rust / Tauri 2.0) -->
  <g transform="translate(40, 70)">
    <rect width="280" height="330" rx="12" fill="url(#cardGrad)" stroke="#f97316" stroke-width="1" stroke-opacity="0.4" />
    <rect x="0" y="0" width="280" height="40" rx="12" fill="#2d1715" />
    <path d="M 0 30 L 0 40 L 280 40 L 280 30" fill="#2d1715" />
    <text x="16" y="25" fill="#fdba74" class="sans" font-size="14" font-weight="700">🦀 Tauri 2.0 Host (Rust Core)</text>

    <!-- Component 1 -->
    <rect x="16" y="55" width="248" height="52" rx="8" fill="#18182b" stroke="#3730a3" stroke-width="0.8" />
    <text x="28" y="76" fill="#f8fafc" class="sans" font-size="12" font-weight="600">Dual-Window Manager</text>
    <text x="28" y="94" fill="#94a3b8" class="mono" font-size="10">Command Center + Always-on-top HUD</text>

    <!-- Component 2 -->
    <rect x="16" y="118" width="248" height="52" rx="8" fill="#18182b" stroke="#3730a3" stroke-width="0.8" />
    <text x="28" y="139" fill="#f8fafc" class="sans" font-size="12" font-weight="600">Global Shortcut Registry</text>
    <text x="28" y="157" fill="#fdba74" class="mono" font-size="10">Ctrl+Space (HUD) • Ctrl+K (Quick Add)</text>

    <!-- Component 3 -->
    <rect x="16" y="181" width="248" height="52" rx="8" fill="#18182b" stroke="#3730a3" stroke-width="0.8" />
    <text x="28" y="202" fill="#f8fafc" class="sans" font-size="12" font-weight="600">Tauri SQL Engine</text>
    <text x="28" y="220" fill="#6ee7b7" class="mono" font-size="10">SQLite v8 Migrations (%APPDATA%)</text>

    <!-- Component 4 -->
    <rect x="16" y="244" width="248" height="66" rx="8" fill="#18182b" stroke="#3730a3" stroke-width="0.8" />
    <text x="28" y="265" fill="#f8fafc" class="sans" font-size="12" font-weight="600">System Tray &amp; Native Bridge</text>
    <text x="28" y="283" fill="#94a3b8" class="mono" font-size="10">Window toggle, autostart, notifications</text>
    <text x="28" y="299" fill="#94a3b8" class="mono" font-size="10">RAM Footprint: ~35-50 MB</text>
  </g>

  <!-- Middle: React 19 Frontend Layer -->
  <g transform="translate(360, 70)">
    <rect width="320" height="330" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <rect x="0" y="0" width="320" height="40" rx="12" fill="#0c2338" />
    <path d="M 0 30 L 0 40 L 320 40 L 320 30" fill="#0c2338" />
    <text x="16" y="25" fill="#7dd3fc" class="sans" font-size="14" font-weight="700">⚛️ React 19 + TypeScript + Vite</text>

    <!-- Sub 1 -->
    <rect x="16" y="55" width="288" height="52" rx="8" fill="#18182b" stroke="#0284c7" stroke-width="0.8" />
    <text x="28" y="76" fill="#f8fafc" class="sans" font-size="12" font-weight="600">Zustand Store &amp; EventBus</text>
    <text x="28" y="94" fill="#38bdf8" class="mono" font-size="10">Reactive state, events, tone triggers</text>

    <!-- Sub 2 -->
    <rect x="16" y="118" width="288" height="52" rx="8" fill="#18182b" stroke="#0284c7" stroke-width="0.8" />
    <text x="28" y="139" fill="#f8fafc" class="sans" font-size="12" font-weight="600">Gamification &amp; UI Engines</text>
    <text x="28" y="157" fill="#c084fc" class="mono" font-size="10">Framer Motion • Confetti • 10 Themes</text>

    <!-- Sub 3 -->
    <rect x="16" y="181" width="288" height="52" rx="8" fill="#18182b" stroke="#0284c7" stroke-width="0.8" />
    <text x="28" y="202" fill="#f8fafc" class="sans" font-size="12" font-weight="600">Web Audio FX Synthesizer</text>
    <text x="28" y="220" fill="#f43f5e" class="mono" font-size="10">Coin, LevelUp, StreakFreeze, Themes</text>

    <!-- Sub 4 -->
    <rect x="16" y="244" width="288" height="66" rx="8" fill="#18182b" stroke="#0284c7" stroke-width="0.8" />
    <text x="28" y="265" fill="#f8fafc" class="sans" font-size="12" font-weight="600">Social Card Engine &amp; Heatmaps</text>
    <text x="28" y="283" fill="#a78bfa" class="mono" font-size="10">html2canvas PNG exporter (1080x1080)</text>
    <text x="28" y="299" fill="#a78bfa" class="mono" font-size="10">84d GitHub-style Habit Heatmap &amp; Radar</text>
  </g>

  <!-- Right: Extensibility & Data Flow -->
  <g transform="translate(720, 70)">
    <rect width="240" height="330" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
    <rect x="0" y="0" width="240" height="40" rx="12" fill="#09281e" />
    <path d="M 0 30 L 0 40 L 240 40 L 240 30" fill="#09281e" />
    <text x="16" y="25" fill="#6ee7b7" class="sans" font-size="14" font-weight="700">🔌 Plugins &amp; Storage</text>

    <!-- Sub 1 -->
    <rect x="16" y="55" width="208" height="52" rx="8" fill="#18182b" stroke="#059669" stroke-width="0.8" />
    <text x="26" y="76" fill="#f8fafc" class="sans" font-size="12" font-weight="600">Plugin Slots &amp; Hub</text>
    <text x="26" y="94" fill="#34d399" class="mono" font-size="10">Dynamic UI extension slots</text>

    <!-- Sub 2 -->
    <rect x="16" y="118" width="208" height="52" rx="8" fill="#18182b" stroke="#059669" stroke-width="0.8" />
    <text x="26" y="139" fill="#f8fafc" class="sans" font-size="12" font-weight="600">Dual Storage Adapter</text>
    <text x="26" y="157" fill="#6ee7b7" class="mono" font-size="10">SQLite ↔ IndexedDB / LS</text>

    <!-- Sub 3 -->
    <rect x="16" y="181" width="208" height="129" rx="8" fill="#18182b" stroke="#059669" stroke-width="0.8" />
    <text x="26" y="202" fill="#f8fafc" class="sans" font-size="12" font-weight="600">Zero Cloud Security</text>
    <text x="26" y="222" fill="#94a3b8" class="sans" font-size="11">✓ 100% Local Files</text>
    <text x="26" y="240" fill="#94a3b8" class="sans" font-size="11">✓ Zero External Telemetry</text>
    <text x="26" y="258" fill="#94a3b8" class="sans" font-size="11">✓ Full JSON / SQLite Export</text>
    <text x="26" y="276" fill="#94a3b8" class="sans" font-size="11">✓ P2P CRDT sync ready</text>
    <text x="26" y="296" fill="#34d399" class="mono" font-size="10">Your Data Belongs To You</text>
  </g>

  <!-- Connective Arrows -->
  <path d="M 320 200 L 360 200" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M 680 200 L 720 200" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" />
</svg>