name: 🐛 Сообщение об ошибке (Bug Report)
description: Сообщить о баге или некорректном поведении в Living Tracker
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что помогаете делать Living Tracker лучше! Пожалуйста, заполните форму ниже.
  - type: input
    id: environment
    attributes:
      label: Окружение
      description: Укажите операционную систему, версию Node.js / Tauri и браузер (если применимо).
      placeholder: Windows 11 / Desktop Tauri 2.0 / Node 22
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Описание проблемы
      description: Четко опишите, что пошло не так.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги для воспроизведения
      description: Пошаговый список действий, приводящий к ошибке.
      placeholder: |
        1. Нажать Ctrl+Space для открытия HUD
        2. Добавить привычку...
        3. Заметить ошибку...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      description: Что должно было произойти?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Скриншоты или логи
      description: Перетащите сюда изображения или скопируйте вывод консоли.
